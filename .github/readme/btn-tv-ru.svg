<svg xmlns="http://www.w3.org/2000/svg" width="340" height="76" viewBox="0 0 340 76" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
<defs>
