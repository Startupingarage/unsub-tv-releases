  .one { opacity:0; animation: one 9.0s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes one { 0%,62% { opacity:0; transform: scale(.85); } 70%,94% { opacity:1; transform: scale(1); } 100% { opacity:0; transform: scale(1); } }
  .glow { animation: glow 3.5s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { *, .pill, .strike, .one { animation: none !important; } .one { opacity:1; } }
</style>
